# Review Formation — Code review layout
name: review
description: "Code review — PR browser + IDE + Claude"

worms:
  - id: pr-browser
    type: app
    monitor: primary
    position:
      zone: left-half
    params:
      app: chrome
      url: https://github.com

  - id: editor
    type: ide
    monitor: primary
    position:
      zone: top-right
    params:
      folder: "."

  - id: claude-review
    type: claude
    monitor: primary
    position:
      zone: bottom-right
    params:
      repo: "."
      shell: wt
