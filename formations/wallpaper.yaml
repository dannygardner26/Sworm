# Wallpaper Formation — 4 terminals covering the screen in quadrants
name: wallpaper
description: "Full-screen terminal wallpaper — 4 agents per monitor"

worms:
  - id: agent-1
    type: generic
    monitor: primary
    position:
      zone: top-left
    params:
      executable: wt.exe
      args: []

  - id: agent-2
    type: generic
    monitor: primary
    position:
      zone: top-right
    params:
      executable: wt.exe
      args: []

  - id: agent-3
    type: generic
    monitor: primary
    position:
      zone: bottom-left
    params:
      executable: wt.exe
      args: []

  - id: agent-4
    type: generic
    monitor: primary
    position:
      zone: bottom-right
    params:
      executable: wt.exe
      args: []
