# Pilot Formation — Primary development layout
# Claude Code on the left, IDE on the right, browser on secondary monitor

name: pilot
description: "Primary dev formation — Claude + IDE + Browser"

monitors:
  main: primary
  reference: right

worms:
  - id: claude-main
    type: claude
    monitor: main
    position:
      zone: left-half
    params:
      repo: "."
      shell: wt

  - id: editor
    type: ide
    monitor: main
    position:
      zone: right-half
    params:
      folder: "."

  - id: browser
    type: app
    monitor: reference
    position:
      zone: full
    params:
      app: chrome
      url: http://localhost:3000
