# Pilot Formation — Primary development layout
# Claude Code on the left, IDE on the right
# Works on single or multi-monitor setups

name: pilot
description: "Primary dev formation — Claude + IDE"

worms:
  - id: claude-main
    type: claude
    monitor: primary
    position:
      zone: left-half
    params:
      repo: "."
      shell: wt

  - id: editor
    type: ide
    monitor: primary
    position:
      zone: right-half
    params:
      folder: "."
