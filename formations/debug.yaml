# Debug Formation — Focused debugging layout
name: debug
description: "Debug formation — Claude + IDE + Logs"

worms:
  - id: editor
    type: ide
    monitor: primary
    position:
      zone: top-half
    params:
      folder: "."

  - id: claude-debug
    type: claude
    monitor: primary
    position:
      zone: bottom-left
    params:
      repo: "."
      shell: wt

  - id: logs
    type: generic
    monitor: primary
    position:
      zone: bottom-right
    params:
      executable: wt.exe
      args: ["-w", "new", "--title", "Logs"]
