<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sworm</title>
  <link rel="icon" href="sworm-icon.png" type="image/png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'">
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="titlebar-drag"></div>
    <canvas id="spark-canvas" style="display:none"></canvas>
    <div id="spark-input-wrap">
      <img id="spark-logo" src="sworm-icon.png" alt="Sworm" draggable="false">
      <div id="spark-text"><span id="spark-cursor"></span></div>
      <div id="spark-hint">
        <span class="hint-key">loading shortcuts...</span>
      </div>
    </div>
    <div id="spark-settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
    <div id="pane-container"></div>
    <div id="status-bar"></div>
    <div id="window-id-overlay" class="hidden"></div>
    <div id="command-palette" class="hidden"></div>
  </div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
